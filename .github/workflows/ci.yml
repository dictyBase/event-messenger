name: Continuous integration
on:
  push:
    branches:
      - develop
jobs:
  testcov:
    runs-on: ubuntu-latest
    steps:
      - name: set up golang
        uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - name: check out code
        uses: actions/checkout@v6
      - name: unit test
        run: go test -covermode=atomic -coverprofile=profile.cov -v ./...
      - name: upload coverage to codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./profile.cov
          token: ${{ secrets.CODECOV }}
  call-build-deploy:
    needs: testcov
    uses: dictyBase/workflows/.github/workflows/composite-deploy.yaml@develop
    secrets: inherit
    with:
      app: event-messenger
      project: event-messenger
      stack: experiments
      repository: ${{ github.repository }}
      ref: ${{ github.ref_name }}
      dockerfile: build/package/Dockerfile
      docker_image: event-messenger
      cluster: ${{ vars.DEV_STAGING_CLUSTER }}
      cluster_state_storage: ${{ vars.DEV_STAGING_KOPS_STATE_STORAGE }}
